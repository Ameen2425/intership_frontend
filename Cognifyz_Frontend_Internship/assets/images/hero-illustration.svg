<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glowHero" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Blobs -->
  <circle cx="300" cy="220" r="160" fill="#6366f1" opacity="0.18" filter="url(#glowHero)"/>
  <circle cx="150" cy="350" r="120" fill="#38bdf8" opacity="0.12" filter="url(#glowHero)"/>
  <circle cx="480" cy="180" r="130" fill="#a855f7" opacity="0.15" filter="url(#glowHero)"/>

  <!-- Main Central Code/App Browser Window -->
  <rect x="70" y="60" width="460" height="340" rx="16" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Browser Window Header -->
  <path d="M 70 76 A 16 16 0 0 1 86 60 L 514 60 A 16 16 0 0 1 530 76 L 530 96 L 70 96 Z" fill="#1e293b"/>
  <circle cx="95" cy="78" r="5" fill="#ef4444"/>
  <circle cx="112" cy="78" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="78" r="5" fill="#10b981"/>
  
  <!-- URL Bar -->
  <rect x="160" y="70" width="280" height="16" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
  <text x="230" y="82" fill="#94a3b8" font-family="monospace" font-size="9">cognifyz.com/internship/live</text>

  <!-- Code Preview Interior -->
  <text x="100" y="130" fill="#38bdf8" font-family="monospace" font-size="13">&lt;<tspan fill="#f43f5e">div</tspan> <tspan fill="#a855f7">class</tspan>=<tspan fill="#10b981">"cognifyz-internship-hub"</tspan>&gt;</text>
  <text x="120" y="155" fill="#94a3b8" font-family="monospace" font-size="12">// Level 1 to 4: 8 Specialized Tasks</text>
  <text x="120" y="180" fill="#cbd5e1" font-family="monospace" font-size="12">const <tspan fill="#38bdf8">internship</tspan> = new <tspan fill="#f59e0b">FrontendSpecialization</tspan>({</text>
  <text x="140" y="205" fill="#94a3b8" font-family="monospace" font-size="12">brand: <tspan fill="#10b981">'Cognifyz Technologies'</tspan>,</text>
  <text x="140" y="230" fill="#94a3b8" font-family="monospace" font-size="12">tagline: <tspan fill="#10b981">'Where Data Meets Intelligence'</tspan>,</text>
  <text x="140" y="255" fill="#94a3b8" font-family="monospace" font-size="12">tasksTotal: <tspan fill="#f59e0b">8</tspan>, status: <tspan fill="#10b981">'Completed 100%'</tspan>,</text>
  <text x="140" y="280" fill="#94a3b8" font-family="monospace" font-size="12">stack: [<tspan fill="#38bdf8">'HTML5'</tspan>, <tspan fill="#818cf8">'CSS3'</tspan>, <tspan fill="#f59e0b">'JS'</tspan>, <tspan fill="#a855f7">'Bootstrap'</tspan>, <tspan fill="#ec4899">'Sass'</tspan>]</text>
  <text x="120" y="305" fill="#cbd5e1" font-family="monospace" font-size="12">});</text>
  <text x="120" y="335" fill="#38bdf8" font-family="monospace" font-size="12">await <tspan fill="#38bdf8">internship</tspan>.<tspan fill="#60a5fa">launchShowcase</tspan>();</text>
  <text x="100" y="365" fill="#38bdf8" font-family="monospace" font-size="13">&lt;/<tspan fill="#f43f5e">div</tspan>&gt;</text>

  <!-- Floating Glass Card 1 (Top Right): Stats Card -->
  <g transform="translate(420, 110)">
    <rect width="160" height="90" rx="14" fill="#0f172a" fill-opacity="0.88" stroke="url(#hGrad1)" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#10b981" fill-opacity="0.15"/>
    <path d="M 23 30 L 27 34 L 34 26" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">Evaluation Score</text>
    <text x="50" y="46" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16">100 / 100</text>
    <rect x="20" y="65" width="120" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="65" width="120" height="6" rx="3" fill="url(#hGrad1)"/>
  </g>

  <!-- Floating Glass Card 2 (Bottom Left): REST API Card -->
  <g transform="translate(20, 280)">
    <rect width="180" height="85" rx="14" fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="12" fill="#38bdf8" fill-opacity="0.2"/>
    <circle cx="26" cy="28" r="5" fill="#38bdf8"/>
    <text x="46" y="28" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">Fetch REST API</text>
    <text x="46" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">200 OK • JSON Parsed</text>
    <text x="20" y="66" fill="#10b981" font-family="monospace" font-size="11">✓ 100 Posts Loaded</text>
  </g>

  <!-- Floating Glass Card 3 (Bottom Right): Tech Stack Pill -->
  <g transform="translate(380, 350)">
    <rect width="190" height="75" rx="14" fill="#0f172a" fill-opacity="0.88" stroke="#a855f7" stroke-width="1.5"/>
    <text x="20" y="28" fill="#c084fc" font-family="sans-serif" font-weight="bold" font-size="11">Sass &amp; Bootstrap 5</text>
    <text x="20" y="46" fill="#94a3b8" font-family="sans-serif" font-size="10">Modular SCSS + Components</text>
    <rect x="20" y="55" width="45" height="12" rx="6" fill="#6366f1" fill-opacity="0.3"/>
    <text x="28" y="64" fill="#a5b4fc" font-family="sans-serif" font-size="8">Mixins</text>
    <rect x="72" y="55" width="45" height="12" rx="6" fill="#a855f7" fill-opacity="0.3"/>
    <text x="77" y="64" fill="#d8b4fe" font-family="sans-serif" font-size="8">Variables</text>
    <rect x="124" y="55" width="48" height="12" rx="6" fill="#ec4899" fill-opacity="0.3"/>
    <text x="130" y="64" fill="#f472b6" font-family="sans-serif" font-size="8">Grid 12</text>
  </g>
</svg>

