<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="40" height="40" rx="10" fill="#0f172a" />
  <rect x="1" y="1" width="38" height="38" rx="9" stroke="url(#logoGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Stylized C with interconnected intelligence nodes -->
  <path d="M 27 13 C 24 10, 15 10, 12 16 C 9 22, 11 29, 17 31 C 22 32.5, 27 30, 28 27" 
        stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <circle cx="27" cy="13" r="2.5" fill="#38bdf8" />
  <circle cx="12" cy="20" r="2" fill="#818cf8" />
  <circle cx="28" cy="27" r="2.5" fill="#c084fc" />
  <circle cx="20" cy="20" r="1.5" fill="#ffffff" />
  <line x1="12" y1="20" x2="20" y2="20" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="20" y1="20" x2="28" y2="27" stroke="#a855f7" stroke-width="1" stroke-dasharray="2,2"/>
</svg>

