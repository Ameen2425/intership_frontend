  <line x1="345" y1="250" x2="285" y2="200" stroke="#f59e0b" stroke-dasharray="4,4" stroke-width="1.5"/>
  
  <text x="250" y="340" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12" letter-spacing="1">COGNIFYZ TECHNOLOGIES ECOSYSTEM</text>
